[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-privacy-ga"
version = "0.1.0"
description = "Reproducible research prototype for multi-objective tabular anonymization"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
privacy-ga = "privacy_ga.cli:main"

[tool.setuptools.packages.find]
include = ["privacy_ga*"]
